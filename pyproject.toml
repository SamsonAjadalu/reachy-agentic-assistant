[project]
name = "reachy-personal-assistant"
version = "0.2.0"
description = "Reachy Agentic Assistant is a workstation service that extends Reachy Mini with Gmail, Calendar, Telegram, Notion, scheduling, memory, and visual-perception tools."
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0.36,<2.1",
    "aiosqlite>=0.20,<0.22",
    "alembic>=1.14,<2.0",
    # Pinned to the 3.11 line: the SQLAlchemyJobStore API used by scheduler/
    # is the documented 3.x interface and differs completely in APScheduler 4.
    "apscheduler>=3.11,<3.12",
    # Telegram and Google are reached over their REST APIs with httpx directly:
    # both official SDKs are synchronous and would need a thread pool in an
    # otherwise fully async service.
    "httpx>=0.27,<1.0",
    "cryptography>=43.0",
    "python-dateutil>=2.9",
    "pillow>=11.0",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "paramiko>=3.5",
    "python-multipart>=0.0.20",
    # Document extraction
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "numpy>=2.0,<3.0",
]

[project.optional-dependencies]
vision = [
    # Install into a dedicated sidecar venv (.venv-vision), never the API venv.
    "numpy>=2.0",
    "torch>=2.5,<3.0",
    "torchvision>=0.20",
    "transformers>=4.51,<5.0",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml",
    "types-python-dateutil",
    "types-paramiko",
    "types-psutil",
]

[project.scripts]
pa-cli = "cli.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "approvals",
    "cli",
    "database",
    "documents",
    "integrations",
    "notifications",
    "proactive",
    "reachy_client",
    "reachy_tools",
    "scheduler",
    "security",
    "shared",
    "wardrobe",
    "vision",
    "vision.eval",
    "workers",
    "workstation",
    "vision_sidecar",
    "vision_sidecar.providers",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["database/migrations/versions"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
    "S",   # bandit
    "ASYNC",
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests and internal invariants
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607", "RUF012", "RUF043"]
"tests/pi/**" = ["E402", "S105", "S106", "S108", "S311", "S603", "S607", "RUF012", "RUF043"]
"scripts/**" = ["S603", "S607", "S310"]
"vision_sidecar/metrics.py" = ["S603"]
"vision_sidecar/ollama.py" = ["S603"]
"vision_sidecar/bakeoff.py" = ["S603"]
"reachy_tools/**" = ["S105", "S106", "RUF012"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
strict_equality = true
plugins = ["pydantic.mypy"]
exclude = "(^|/)(\\.venv|build|dist|database/migrations/versions)(/|$)"

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "paramiko.*",
    "pptx.*",
    "docx.*",
    "openpyxl.*",
    "respx.*",
    "keyring.*",
    "reachy_mini_conversation_app.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "ultralytics",
    "ultralytics.*",
    "depth_anything_3",
    "depth_anything_3.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["vision_sidecar.providers.grounding_dino", "vision_sidecar.providers.sam2", "vision_sidecar.providers.dinov2", "vision_sidecar.providers.da3", "vision_sidecar.providers.yolo_world", "vision_sidecar.providers.base"]
# Real GPU wrappers are exercised under .venv-vision; API mypy stays mock-first.
ignore_errors = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: tests that require real external credentials and are skipped by default",
    "slow: long-running tests",
]
filterwarnings = ["ignore::DeprecationWarning:pkg_resources"]

[tool.coverage.run]
source = ["app", "approvals", "cli", "database", "documents", "integrations", "notifications", "proactive", "reachy_client", "reachy_tools", "scheduler", "security", "shared", "vision", "wardrobe", "workers", "workstation"]
omit = ["*/migrations/*", "*/__main__.py"]
