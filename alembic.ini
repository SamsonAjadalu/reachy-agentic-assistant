[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os
# The URL is resolved from Settings in env.py so the data directory stays the
# single source of truth; this value is only a fallback for tooling that
# inspects the file directly.
sqlalchemy.url =

# No post-write hooks: generated revisions are excluded from Ruff in
# pyproject.toml, so reformatting them would only create noise.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
