# Example workstation script registry.
#
# Copy to config/registered_scripts.yaml (or point WORKSTATION_SCRIPT_REGISTRY
# at this file) and uncomment entries whose executables exist on your machine.
#
# The live config/registered_scripts.yaml ships with scripts: [] — an empty
# allowlist. Nothing runs until you deliberately add entries here and commit
# the change. The API cannot edit this file; new capabilities require a git
# change, same as any other code.
#
# See docs/operations.md and workstation/registry.py for validation rules.

