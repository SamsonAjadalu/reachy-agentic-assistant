# Scripts the assistant is allowed to run on this workstation.
#
# This file is the allowlist. Nothing outside it can be executed, and it cannot
# be edited through the API - adding a capability is a deliberate change here,
# reviewed in git like any other code.
#
# Each entry declares an absolute executable and a typed parameter list. Values
# supplied at call time are validated against those declarations and passed as
# argv, so an argument is always one argument regardless of what it contains.
#
# Fields:
#   name              Identifier used by the API. Lowercase, no spaces.
#   description       Shown in the approval prompt. Write it for the person
#                     deciding whether to tap Approve.
#   executable        Absolute path. Bare names are refused because PATH is not
#                     under the caller's control.
#   working_directory Optional. The process starts here.
#   risk_level        read | reversible_write | external_write
#   requires_approval Whether the owner must confirm before it runs.
#   timeout_seconds   Hard limit. The process group is killed after it.
#   parameters        Typed inputs. Types: string, integer, number, boolean,
#                     choice, path. Add `flag` to pass as --option value,
#                     otherwise the value is positional.
#
# The entries below are commented out because they reference paths that will
# not exist on a fresh checkout. Uncomment and correct the paths for scripts
# that actually exist on your machine.

scripts: []
